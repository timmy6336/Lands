<svg xmlns="http://www.w3.org/2000/svg" width="400" height="260" viewBox="0 0 400 260">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#080810"/><stop offset="100%" stop-color="#101018"/>
  </linearGradient>
  <filter id="g"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="sg"><feGaussianBlur stdDeviation="1.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <radialGradient id="v" cx="50%" cy="50%" r="65%">
    <stop offset="0%" stop-color="rgba(0,0,0,0)"/><stop offset="100%" stop-color="rgba(0,0,0,0.45)"/>
  </radialGradient>
</defs>
<rect width="400" height="260" fill="url(#bg)" rx="12"/>
<!-- Velvet texture -->
<g stroke="#12121c" stroke-width="0.4" stroke-opacity="0.4">
  <line x1="0" y1="32" x2="400" y2="32"/><line x1="0" y1="65" x2="400" y2="65"/>
