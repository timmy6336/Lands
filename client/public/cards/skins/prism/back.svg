<svg xmlns="http://www.w3.org/2000/svg" width="200" height="280" viewBox="0 0 200 280">
<defs>
  <linearGradient id="s" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0a0a10"/><stop offset="50%" stop-color="#0e0e18"/><stop offset="100%" stop-color="#121220"/>
  </linearGradient>
  <!-- Refracted rainbow rays -->
  <linearGradient id="r1" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#ff3333" stop-opacity="0.7"/><stop offset="100%" stop-color="#ff3333" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="r2" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#ff9933" stop-opacity="0.7"/><stop offset="100%" stop-color="#ff9933" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="r3" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#ffee33" stop-opacity="0.65"/><stop offset="100%" stop-color="#ffee33" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="r4" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#44ee44" stop-opacity="0.65"/><stop offset="100%" stop-color="#44ee44" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="r5" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#3399ff" stop-opacity="0.7"/><stop offset="100%" stop-color="#3399ff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="r6" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#9944ff" stop-opacity="0.7"/><stop offset="100%" stop-color="#9944ff" stop-opacity="0"/>
  </linearGradient>
  <!-- Incoming white beam -->
  <linearGradient id="wb" x1="1" y1="0" x2="0" y2="0">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <filter id="rg"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="bg"><feGaussianBlur stdDeviation="6"/></filter>
  <radialGradient id="v" cx="50%" cy="50%" r="70%">
    <stop offset="0%" stop-color="rgba(0,0,0,0)"/><stop offset="100%" stop-color="rgba(0,0,0,0.55)"/>
  </radialGradient>
  <linearGradient id="fr" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#aaddff"/><stop offset="100%" stop-color="#334455"/>
  </linearGradient>
  <!-- Prism face gradient -->
  <linearGradient id="pf" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#d0d8f0" stop-opacity="0.35"/><stop offset="100%" stop-color="#606880" stop-opacity="0.15"/>
  </linearGradient>
</defs>
<rect width="200" height="280" fill="url(#s)" rx="10"/>
<!-- Fine velvet texture -->
<g stroke="#14141e" stroke-width="0.4" stroke-opacity="0.5">
  <line x1="0" y1="40" x2="200" y2="40"/><line x1="0" y1="80" x2="200" y2="80"/>
  <line x1="0" y1="120" x2="200" y2="120"/><line x1="0" y1="160" x2="200" y2="160"/>
  <line x1="0" y1="200" x2="200" y2="200"/><line x1="0" y1="240" x2="200" y2="240"/>
</g>
<!-- === PRISM === -->
<!-- Soft background glow where rainbow spreads -->
<ellipse cx="145" cy="160" rx="50" ry="70" fill="rgba(80,80,120,0.08)" filter="url(#bg)"/>
<!-- Incoming white beam (left side, angled down-right toward prism apex) -->
<polygon points="14,98 14,110 98,140 98,130" fill="url(#wb)" opacity="0.55"/>
<!-- Prism body — equilateral triangle, centered -->
<polygon points="100,68 148,180 52,180"
  fill="url(#pf)" stroke="#b0b8d0" stroke-width="1.4" stroke-opacity="0.7"/>
<!-- Prism internal refraction line -->
<line x1="100" y1="68" x2="100" y2="180" stroke="rgba(200,210,240,0.15)" stroke-width="0.8"/>
<line x1="76" y1="124" x2="124" y2="124" stroke="rgba(200,210,240,0.12)" stroke-width="0.6"/>
<!-- Prism edge glow -->
<g filter="url(#rg)" opacity="0.5">
  <polygon points="100,68 148,180 52,180" fill="none" stroke="#c0c8e0" stroke-width="3"/>
</g>
<!-- Refracted rainbow rays (fanning out to the right from prism base-right corner at ~148,180) -->
<!-- Blurred soft rays -->
<g filter="url(#rg)" opacity="0.6">
  <line x1="148" y1="180" x2="200" y2="158" stroke="#ff3333" stroke-width="4"/>
  <line x1="148" y1="180" x2="200" y2="168" stroke="#ff9933" stroke-width="4"/>
  <line x1="148" y1="180" x2="200" y2="178" stroke="#ffee33" stroke-width="4"/>
  <line x1="148" y1="180" x2="200" y2="188" stroke="#44ee44" stroke-width="4"/>
  <line x1="148" y1="180" x2="200" y2="198" stroke="#3399ff" stroke-width="4"/>
  <line x1="148" y1="180" x2="196" y2="210" stroke="#9944ff" stroke-width="4"/>
</g>
<!-- Crisp ray lines over glow -->
<line x1="148" y1="180" x2="200" y2="158" stroke="#ff4444" stroke-width="1.2" stroke-opacity="0.85"/>
<line x1="148" y1="180" x2="200" y2="168" stroke="#ffaa33" stroke-width="1.2" stroke-opacity="0.85"/>
<line x1="148" y1="180" x2="200" y2="178" stroke="#ffee44" stroke-width="1.2" stroke-opacity="0.8"/>
<line x1="148" y1="180" x2="200" y2="188" stroke="#55ee55" stroke-width="1.2" stroke-opacity="0.8"/>
<line x1="148" y1="180" x2="200" y2="198" stroke="#44aaff" stroke-width="1.2" stroke-opacity="0.85"/>
<line x1="148" y1="180" x2="196" y2="210" stroke="#aa55ff" stroke-width="1.2" stroke-opacity="0.85"/>
<!-- Small spectrum dots on right edge for extra pop -->
<g filter="url(#rg)" opacity="0.7">
  <circle cx="198" cy="158" r="2.5" fill="#ff4444"/>
  <circle cx="198" cy="168" r="2.5" fill="#ffaa33"/>
  <circle cx="198" cy="178" r="2.5" fill="#ffee44"/>
  <circle cx="198" cy="188" r="2.5" fill="#55ee55"/>
  <circle cx="198" cy="198" r="2.5" fill="#44aaff"/>
  <circle cx="194" cy="210" r="2.5" fill="#aa55ff"/>
</g>
<rect width="200" height="280" fill="url(#v)" rx="10"/>
<rect x="5" y="5" width="190" height="270" rx="8" fill="none" stroke="url(#fr)" stroke-width="2.5"/>
<rect x="9" y="9" width="182" height="262" rx="6" fill="none" stroke="#6688aa" stroke-width="0.6" stroke-opacity="0.4"/>
<g fill="#223344" opacity="0.75">
  <polygon points="9,9 22,9 9,22"/><polygon points="191,9 178,9 191,22"/>
  <polygon points="9,271 22,271 9,258"/><polygon points="191,271 178,271 191,258"/>
</g>
</svg>
