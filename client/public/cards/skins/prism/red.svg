<svg xmlns="http://www.w3.org/2000/svg" width="200" height="280" viewBox="0 0 200 280">
<defs>
  <linearGradient id="s" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#120808"/><stop offset="50%" stop-color="#1a0c0c"/><stop offset="100%" stop-color="#200e0e"/>
  </linearGradient>
  <radialGradient id="rc" cx="50%" cy="44%" r="40%">
    <stop offset="0%" stop-color="#ff4444" stop-opacity="0.9"/><stop offset="45%" stop-color="#cc1122" stop-opacity="0.45"/><stop offset="100%" stop-color="#120808" stop-opacity="0"/>
  </radialGradient>
  <filter id="rg"><feGaussianBlur stdDeviation="4.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="sg"><feGaussianBlur stdDeviation="1.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <radialGradient id="v" cx="50%" cy="50%" r="70%">
    <stop offset="0%" stop-color="rgba(0,0,0,0)"/><stop offset="100%" stop-color="rgba(0,0,0,0.58)"/>
  </radialGradient>
  <linearGradient id="fr" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#ff6655"/><stop offset="100%" stop-color="#550010"/>
  </linearGradient>
</defs>
<rect width="200" height="280" fill="url(#s)" rx="10"/>
<!-- Velvet sheen -->
<g stroke="#1e0c0c" stroke-width="0.4" stroke-opacity="0.4">
  <line x1="0" y1="35" x2="200" y2="35"/><line x1="0" y1="70" x2="200" y2="70"/>
  <line x1="0" y1="105" x2="200" y2="105"/><line x1="0" y1="140" x2="200" y2="140"/>
  <line x1="0" y1="175" x2="200" y2="175"/><line x1="0" y1="210" x2="200" y2="210"/>
  <line x1="0" y1="245" x2="200" y2="245"/>
</g>
<ellipse cx="100" cy="123" rx="52" ry="60" fill="url(#rc)"/>
<!-- Ruby crystal — emerald cut (rectangular with stepped facets) -->
<!-- Glow outline -->
<g filter="url(#rg)" opacity="0.75">
  <polygon points="75,68 125,68 148,92 148,160 125,184 75,184 52,160 52,92"
    fill="none" stroke="#ff3322" stroke-width="6"/>
</g>
<!-- Outer octagon -->
<polygon points="75,68 125,68 148,92 148,160 125,184 75,184 52,160 52,92"
  fill="rgba(200,30,20,0.08)" stroke="#ff5544" stroke-width="1.3" stroke-opacity="0.75"/>
<!-- First step inward -->
<polygon points="82,80 118,80 136,96 136,156 118,172 82,172 64,156 64,96"
  fill="rgba(220,50,30,0.1)" stroke="#ff4433" stroke-width="0.9" stroke-opacity="0.6"/>
<!-- Table (center rectangle) -->
<rect x="78" y="94" width="44" height="64" rx="2"
  fill="rgba(255,80,60,0.15)" stroke="#ff7766" stroke-width="0.9" stroke-opacity="0.7"/>
<!-- Step facet lines horizontal -->
<line x1="64" y1="126" x2="78" y2="126" stroke="rgba(255,80,60,0.45)" stroke-width="0.7"/>
<line x1="122" y1="126" x2="136" y2="126" stroke="rgba(255,80,60,0.45)" stroke-width="0.7"/>
<!-- Corner facet diagonals -->
<line x1="75" y1="68" x2="82" y2="80" stroke="#ff5544" stroke-width="0.8" stroke-opacity="0.55"/>
<line x1="125" y1="68" x2="118" y2="80" stroke="#ff5544" stroke-width="0.8" stroke-opacity="0.55"/>
<line x1="148" y1="92" x2="136" y2="96" stroke="#ff5544" stroke-width="0.8" stroke-opacity="0.55"/>
<line x1="148" y1="160" x2="136" y2="156" stroke="#ff5544" stroke-width="0.8" stroke-opacity="0.55"/>
<line x1="125" y1="184" x2="118" y2="172" stroke="#ff5544" stroke-width="0.8" stroke-opacity="0.55"/>
<line x1="75" y1="184" x2="82" y2="172" stroke="#ff5544" stroke-width="0.8" stroke-opacity="0.55"/>
<line x1="52" y1="160" x2="64" y2="156" stroke="#ff5544" stroke-width="0.8" stroke-opacity="0.55"/>
<line x1="52" y1="92" x2="64" y2="96" stroke="#ff5544" stroke-width="0.8" stroke-opacity="0.55"/>
<!-- Inner glow core -->
<ellipse cx="100" cy="126" rx="14" ry="20" fill="#ff2200" fill-opacity="0.5" filter="url(#rg)"/>
<!-- Sparkle -->
<g filter="url(#sg)" stroke="#ffaaaa" stroke-linecap="round" stroke-opacity="0.9">
  <line x1="100" y1="106" x2="100" y2="97" stroke-width="1.5"/>
  <line x1="100" y1="146" x2="100" y2="155" stroke-width="1.5"/>
  <line x1="82" y1="126" x2="73" y2="126" stroke-width="1.5"/>
  <line x1="118" y1="126" x2="127" y2="126" stroke-width="1.5"/>
</g>
<rect x="5" y="5" width="190" height="270" rx="8" fill="none" stroke="url(#fr)" stroke-width="2.5"/>
<rect x="9" y="9" width="182" height="262" rx="6" fill="none" stroke="#cc4433" stroke-width="0.7" stroke-opacity="0.45"/>
<g fill="#441122" opacity="0.75">
  <polygon points="9,9 22,9 9,22"/><polygon points="191,9 178,9 191,22"/>
  <polygon points="9,271 22,271 9,258"/><polygon points="191,271 178,271 191,258"/>
</g>
<rect width="200" height="280" fill="url(#v)" rx="10"/>
<rect x="52" y="257" width="96" height="16" rx="4" fill="rgba(0,0,0,0.5)"/>
<text x="100" y="268.5" font-size="8.5" font-family="Georgia,serif" font-weight="bold" text-anchor="middle" fill="#ffaaaa" letter-spacing="3">RUBY</text>
</svg>
