<svg xmlns="http://www.w3.org/2000/svg" width="200" height="280" viewBox="0 0 200 280">
<defs>
  <linearGradient id="s" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#080e08"/><stop offset="50%" stop-color="#0c1410"/><stop offset="100%" stop-color="#101a12"/>
  </linearGradient>
  <radialGradient id="rc" cx="50%" cy="44%" r="40%">
    <stop offset="0%" stop-color="#22ee44" stop-opacity="0.85"/><stop offset="45%" stop-color="#116622" stop-opacity="0.45"/><stop offset="100%" stop-color="#080e08" stop-opacity="0"/>
  </radialGradient>
  <filter id="rg"><feGaussianBlur stdDeviation="4.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="sg"><feGaussianBlur stdDeviation="1.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <radialGradient id="v" cx="50%" cy="50%" r="70%">
    <stop offset="0%" stop-color="rgba(0,0,0,0)"/><stop offset="100%" stop-color="rgba(0,0,0,0.58)"/>
  </radialGradient>
  <linearGradient id="fr" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#44dd66"/><stop offset="100%" stop-color="#113322"/>
  </linearGradient>
</defs>
<rect width="200" height="280" fill="url(#s)" rx="10"/>
<!-- Velvet sheen -->
<g stroke="#0e1810" stroke-width="0.4" stroke-opacity="0.4">
  <line x1="0" y1="35" x2="200" y2="35"/><line x1="0" y1="70" x2="200" y2="70"/>
  <line x1="0" y1="105" x2="200" y2="105"/><line x1="0" y1="140" x2="200" y2="140"/>
  <line x1="0" y1="175" x2="200" y2="175"/><line x1="0" y1="210" x2="200" y2="210"/>
  <line x1="0" y1="245" x2="200" y2="245"/>
</g>
<ellipse cx="100" cy="124" rx="52" ry="60" fill="url(#rc)"/>
<!-- Emerald — step cut (the classic for emeralds) -->
<!-- Glow outline -->
<g filter="url(#rg)" opacity="0.75">
  <polygon points="78,66 122,66 146,90 146,162 122,186 78,186 54,162 54,90"
    fill="none" stroke="#22cc44" stroke-width="6"/>
</g>
<!-- Outer octagon -->
<polygon points="78,66 122,66 146,90 146,162 122,186 78,186 54,162 54,90"
  fill="rgba(20,150,40,0.07)" stroke="#33dd55" stroke-width="1.3" stroke-opacity="0.75"/>
<!-- Step 1 -->
<polygon points="85,78 115,78 134,95 134,157 115,174 85,174 66,157 66,95"
  fill="rgba(30,160,50,0.09)" stroke="#33cc55" stroke-width="0.9" stroke-opacity="0.6"/>
<!-- Step 2 (table) -->
<polygon points="90,90 110,90 124,103 124,149 110,162 90,162 76,149 76,103"
  fill="rgba(40,180,60,0.12)" stroke="#55ee77" stroke-width="0.9" stroke-opacity="0.65"/>
<!-- Inner table highlight -->
<rect x="83" y="103" width="34" height="46" rx="2"
  fill="rgba(50,200,80,0.1)" stroke="#77ffaa" stroke-width="0.7" stroke-opacity="0.5"/>
<!-- Horizontal step lines (emerald characteristic banding) -->
<line x1="66" y1="116" x2="134" y2="116" stroke="rgba(50,200,80,0.3)" stroke-width="0.6"/>
<line x1="66" y1="126" x2="134" y2="126" stroke="rgba(50,200,80,0.25)" stroke-width="0.5"/>
<line x1="66" y1="136" x2="134" y2="136" stroke="rgba(50,200,80,0.3)" stroke-width="0.6"/>
<!-- Corner step ties -->
<line x1="78" y1="66" x2="85" y2="78" stroke="#33dd55" stroke-width="0.8" stroke-opacity="0.55"/>
<line x1="122" y1="66" x2="115" y2="78" stroke="#33dd55" stroke-width="0.8" stroke-opacity="0.55"/>
<line x1="146" y1="90" x2="134" y2="95" stroke="#33dd55" stroke-width="0.8" stroke-opacity="0.55"/>
<line x1="146" y1="162" x2="134" y2="157" stroke="#33dd55" stroke-width="0.8" stroke-opacity="0.55"/>
<line x1="122" y1="186" x2="115" y2="174" stroke="#33dd55" stroke-width="0.8" stroke-opacity="0.55"/>
<line x1="78" y1="186" x2="85" y2="174" stroke="#33dd55" stroke-width="0.8" stroke-opacity="0.55"/>
<line x1="54" y1="162" x2="66" y2="157" stroke="#33dd55" stroke-width="0.8" stroke-opacity="0.55"/>
<line x1="54" y1="90" x2="66" y2="95" stroke="#33dd55" stroke-width="0.8" stroke-opacity="0.55"/>
<!-- Core glow -->
<ellipse cx="100" cy="126" rx="12" ry="16" fill="#22cc44" fill-opacity="0.5" filter="url(#rg)"/>
<!-- Sparkle -->
<g filter="url(#sg)" stroke="#aaffbb" stroke-linecap="round" stroke-opacity="0.9">
  <line x1="100" y1="108" x2="100" y2="99" stroke-width="1.5"/>
  <line x1="100" y1="144" x2="100" y2="153" stroke-width="1.5"/>
  <line x1="84" y1="126" x2="75" y2="126" stroke-width="1.5"/>
  <line x1="116" y1="126" x2="125" y2="126" stroke-width="1.5"/>
</g>
<rect x="5" y="5" width="190" height="270" rx="8" fill="none" stroke="url(#fr)" stroke-width="2.5"/>
<rect x="9" y="9" width="182" height="262" rx="6" fill="none" stroke="#338844" stroke-width="0.7" stroke-opacity="0.45"/>
<g fill="#113322" opacity="0.75">
  <polygon points="9,9 22,9 9,22"/><polygon points="191,9 178,9 191,22"/>
  <polygon points="9,271 22,271 9,258"/><polygon points="191,271 178,271 191,258"/>
</g>
<rect width="200" height="280" fill="url(#v)" rx="10"/>
<rect x="40" y="257" width="120" height="16" rx="4" fill="rgba(0,0,0,0.5)"/>
<text x="100" y="268.5" font-size="8.5" font-family="Georgia,serif" font-weight="bold" text-anchor="middle" fill="#88ffaa" letter-spacing="2">EMERALD</text>
</svg>
