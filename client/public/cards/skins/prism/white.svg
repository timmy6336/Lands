<svg xmlns="http://www.w3.org/2000/svg" width="200" height="280" viewBox="0 0 200 280">
<defs>
  <linearGradient id="s" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0d0d12"/><stop offset="50%" stop-color="#111118"/><stop offset="100%" stop-color="#16161e"/>
  </linearGradient>
  <!-- Diamond brilliance: cold white-blue core -->
  <radialGradient id="dc" cx="50%" cy="44%" r="38%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/><stop offset="35%" stop-color="#ddeeff" stop-opacity="0.6"/><stop offset="100%" stop-color="#0d0d12" stop-opacity="0"/>
  </radialGradient>
  <!-- Sparkle ray gradient -->
  <radialGradient id="sp" cx="50%" cy="44%" r="52%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/><stop offset="100%" stop-color="#aaccff" stop-opacity="0"/>
  </radialGradient>
  <filter id="rg"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="sg"><feGaussianBlur stdDeviation="1.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <radialGradient id="v" cx="50%" cy="50%" r="70%">
    <stop offset="0%" stop-color="rgba(0,0,0,0)"/><stop offset="100%" stop-color="rgba(0,0,0,0.55)"/>
  </radialGradient>
  <linearGradient id="fr" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#ddeeff"/><stop offset="100%" stop-color="#445566"/>
  </linearGradient>
</defs>
<rect width="200" height="280" fill="url(#s)" rx="10"/>
<!-- Velvet texture — subtle diagonal sheen -->
<rect width="200" height="280" fill="none" stroke="#1a1a28" stroke-width="0" rx="10" opacity="0.6"/>
<g stroke="#1c1c26" stroke-width="0.4" stroke-opacity="0.35">
  <line x1="0" y1="35" x2="200" y2="35"/><line x1="0" y1="70" x2="200" y2="70"/>
  <line x1="0" y1="105" x2="200" y2="105"/><line x1="0" y1="140" x2="200" y2="140"/>
  <line x1="0" y1="175" x2="200" y2="175"/><line x1="0" y1="210" x2="200" y2="210"/>
  <line x1="0" y1="245" x2="200" y2="245"/>
</g>
<!-- Glow backdrop -->
<ellipse cx="100" cy="123" rx="52" ry="60" fill="url(#sp)"/>
<!-- Diamond crystal — top view with facets -->
<!-- Main outline: brilliant cut top (table + crown) -->
<g filter="url(#rg)" opacity="0.7">
  <polygon points="100,62 154,104 154,152 100,182 46,152 46,104"
    fill="none" stroke="#ccddff" stroke-width="5"/>
</g>
<!-- Main fill facets -->
<!-- Outer hexagon -->
<polygon points="100,62 154,104 154,152 100,182 46,152 46,104"
  fill="rgba(200,220,255,0.06)" stroke="#aaccff" stroke-width="1.2" stroke-opacity="0.7"/>
<!-- Table (center hexagon) -->
<polygon points="100,84 130,102 130,130 100,148 70,130 70,102"
  fill="rgba(255,255,255,0.12)" stroke="#ddeeff" stroke-width="1" stroke-opacity="0.8"/>
<!-- Kite facets — upper crown -->
<line x1="100" y1="62" x2="100" y2="84" stroke="#ddeeff" stroke-width="0.8" stroke-opacity="0.6"/>
<line x1="154" y1="104" x2="130" y2="102" stroke="#ddeeff" stroke-width="0.8" stroke-opacity="0.6"/>
<line x1="154" y1="152" x2="130" y2="130" stroke="#ddeeff" stroke-width="0.8" stroke-opacity="0.6"/>
<line x1="100" y1="182" x2="100" y2="148" stroke="#ddeeff" stroke-width="0.8" stroke-opacity="0.6"/>
<line x1="46" y1="152" x2="70" y2="130" stroke="#ddeeff" stroke-width="0.8" stroke-opacity="0.6"/>
<line x1="46" y1="104" x2="70" y2="102" stroke="#ddeeff" stroke-width="0.8" stroke-opacity="0.6"/>
<!-- Mid-facet diagonals for sparkle -->
<line x1="100" y1="84" x2="130" y2="130" stroke="rgba(255,255,255,0.18)" stroke-width="0.6"/>
<line x1="100" y1="84" x2="70" y2="130" stroke="rgba(255,255,255,0.18)" stroke-width="0.6"/>
<!-- Brilliance core -->
<ellipse cx="100" cy="122" rx="18" ry="18" fill="url(#dc)"/>
<!-- Sparkle rays -->
<g filter="url(#sg)" stroke="#ffffff" stroke-linecap="round" stroke-opacity="0.85">
  <line x1="100" y1="105" x2="100" y2="94" stroke-width="1.5"/>
  <line x1="100" y1="139" x2="100" y2="150" stroke-width="1.5"/>
  <line x1="84" y1="122" x2="73" y2="122" stroke-width="1.5"/>
  <line x1="116" y1="122" x2="127" y2="122" stroke-width="1.5"/>
  <line x1="89" y1="111" x2="82" y2="104" stroke-width="1"/>
  <line x1="111" y1="111" x2="118" y2="104" stroke-width="1"/>
  <line x1="89" y1="133" x2="82" y2="140" stroke-width="1"/>
  <line x1="111" y1="133" x2="118" y2="140" stroke-width="1"/>
</g>
<!-- Rainbow prismatic flares (faint) -->
<line x1="100" y1="122" x2="148" y2="88" stroke="#ffaacc" stroke-width="0.7" stroke-opacity="0.3"/>
<line x1="100" y1="122" x2="52" y2="88" stroke="#aaccff" stroke-width="0.7" stroke-opacity="0.3"/>
<rect x="5" y="5" width="190" height="270" rx="8" fill="none" stroke="url(#fr)" stroke-width="2.5"/>
<rect x="9" y="9" width="182" height="262" rx="6" fill="none" stroke="#aaccdd" stroke-width="0.7" stroke-opacity="0.45"/>
<g fill="#334455" opacity="0.75">
  <polygon points="9,9 22,9 9,22"/><polygon points="191,9 178,9 191,22"/>
  <polygon points="9,271 22,271 9,258"/><polygon points="191,271 178,271 191,258"/>
</g>
<rect width="200" height="280" fill="url(#v)" rx="10"/>
<rect x="46" y="257" width="108" height="16" rx="4" fill="rgba(0,0,0,0.5)"/>
<text x="100" y="268.5" font-size="8.5" font-family="Georgia,serif" font-weight="bold" text-anchor="middle" fill="#ddeeff" letter-spacing="2.5">DIAMOND</text>
</svg>
