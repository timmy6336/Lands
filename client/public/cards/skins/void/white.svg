<rect x="5" y="5" width="190" height="270" rx="8" fill="none" stroke="#99ccff" stroke-width="0.6" stroke-opacity="0.7"/>
<g fill="#5588cc" opacity="0.9"><polygon points="9,9 20,9 9,20"/><polygon points="191,9 180,9 191,20"/><polygon points="9,271 20,271 9,260"/><polygon points="191,271 180,271 191,260"/></g>
<rect x="52" y="257" width="96" height="16" rx="4" fill="rgba(0,0,0,0.65)"/>
<text x="100" y="268.5" font-size="8.5" font-family="'Courier New',monospace" font-weight="bold" text-anchor="middle" fill="#aaddff" letter-spacing="2.5">PULSAR</text>
</svg>
