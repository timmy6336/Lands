<svg xmlns="http://www.w3.org/2000/svg" width="200" height="280" viewBox="0 0 200 280">
<defs>
  <linearGradient id="s" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#020610"/><stop offset="55%" stop-color="#040a1c"/><stop offset="100%" stop-color="#060e28"/>
  </linearGradient>
  <radialGradient id="starglow" cx="50%" cy="39%" r="22%">
    <stop offset="0%" stop-color="#ffffff"/><stop offset="35%" stop-color="#c8e8ff" stop-opacity="0.7"/><stop offset="100%" stop-color="#1a3366" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="disk" cx="50%" cy="39%" r="32%">
    <stop offset="0%" stop-color="#88aadd" stop-opacity="0.7"/><stop offset="60%" stop-color="#3355aa" stop-opacity="0.3"/><stop offset="100%" stop-color="transparent"/>
  </radialGradient>
  <filter id="g"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <radialGradient id="v" cx="50%" cy="50%" r="70%">
    <stop offset="0%" stop-color="rgba(0,0,0,0)"/><stop offset="100%" stop-color="rgba(0,0,0,0.6)"/>
  </radialGradient>
  <linearGradient id="fr" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#99ccff"/><stop offset="100%" stop-color="#224488"/>
  </linearGradient>
</defs>
<rect width="200" height="280" fill="url(#s)" rx="10"/>
<g fill="white" opacity="0.75">
  <circle cx="18" cy="14" r="0.7"/><circle cx="44" cy="28" r="0.5"/><circle cx="70" cy="8" r="0.8"/>
  <circle cx="128" cy="18" r="0.6"/><circle cx="165" cy="7" r="0.7"/><circle cx="186" cy="32" r="0.5"/>
  <circle cx="10" cy="52" r="0.6"/><circle cx="158" cy="52" r="0.9"/><circle cx="38" cy="82" r="0.5"/>
  <circle cx="178" cy="72" r="0.7"/><circle cx="14" cy="110" r="0.6"/><circle cx="192" cy="98" r="0.5"/>
  <circle cx="26" cy="158" r="0.7"/><circle cx="182" cy="148" r="0.6"/><circle cx="34" cy="202" r="0.5"/>
  <circle cx="172" cy="208" r="0.8"/><circle cx="14" cy="242" r="0.6"/><circle cx="187" cy="248" r="0.7"/>
</g>
<!-- Polar jets -->
<line x1="100" y1="108" x2="100" y2="14" stroke="#aaccff" stroke-width="3" stroke-opacity="0.22" filter="url(#g)"/>
<line x1="100" y1="108" x2="100" y2="202" stroke="#aaccff" stroke-width="3" stroke-opacity="0.22" filter="url(#g)"/>
<line x1="100" y1="108" x2="100" y2="14" stroke="white" stroke-width="1" stroke-opacity="0.65"/>
<line x1="100" y1="108" x2="100" y2="202" stroke="white" stroke-width="1" stroke-opacity="0.65"/>
<!-- Accretion disk -->
<ellipse cx="100" cy="108" rx="55" ry="13" fill="url(#disk)"/>
<ellipse cx="100" cy="108" rx="55" ry="13" fill="none" stroke="#5577cc" stroke-width="0.8" stroke-opacity="0.55"/>
<!-- Pulsar star -->
<circle cx="100" cy="108" r="16" fill="url(#starglow)"/>
<circle cx="100" cy="108" r="7" fill="#ddeeff" filter="url(#g)"/>
<circle cx="100" cy="108" r="4" fill="white"/>
<rect width="200" height="280" fill="url(#v)" rx="10"/>
