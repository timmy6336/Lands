<svg xmlns="http://www.w3.org/2000/svg" width="200" height="280" viewBox="0 0 200 280">
<defs>
  <linearGradient id="s" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#010104"/><stop offset="55%" stop-color="#040210"/><stop offset="100%" stop-color="#06031a"/>
  </linearGradient>
  <radialGradient id="disk" cx="50%" cy="50%" r="42%">
    <stop offset="0%" stop-color="#ff9900" stop-opacity="0.92"/><stop offset="32%" stop-color="#cc5500" stop-opacity="0.72"/><stop offset="65%" stop-color="#881100" stop-opacity="0.48"/><stop offset="100%" stop-color="#220000" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="inner" cx="50%" cy="50%" r="22%">
    <stop offset="0%" stop-color="#7744ff" stop-opacity="0.55"/><stop offset="100%" stop-color="transparent"/>
  </radialGradient>
  <filter id="g"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="sg"><feGaussianBlur stdDeviation="1" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <radialGradient id="v" cx="50%" cy="50%" r="70%">
    <stop offset="0%" stop-color="rgba(0,0,0,0)"/><stop offset="100%" stop-color="rgba(0,0,0,0.65)"/>
  </radialGradient>
  <linearGradient id="fr" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#9955ff"/><stop offset="100%" stop-color="#220044"/>
  </linearGradient>
</defs>
<rect width="200" height="280" fill="url(#s)" rx="10"/>
<g fill="white">
  <circle cx="18" cy="10" r="0.7" opacity="0.8"/><circle cx="44" cy="18" r="0.5" opacity="0.7"/>
  <circle cx="72" cy="6" r="0.8" opacity="0.9"/><circle cx="136" cy="12" r="0.6" opacity="0.7"/>
  <circle cx="172" cy="8" r="0.7" opacity="0.8"/><circle cx="188" cy="28" r="0.5" opacity="0.6"/>
  <circle cx="14" cy="50" r="0.6" opacity="0.7"/><circle cx="182" cy="45" r="0.8" opacity="0.8"/>
  <circle cx="10" cy="200" r="0.6" opacity="0.5"/><circle cx="190" cy="208" r="0.7" opacity="0.6"/>
  <circle cx="20" cy="240" r="0.5" opacity="0.5"/><circle cx="184" cy="252" r="0.6" opacity="0.7"/>
</g>
<!-- Stars being pulled — arc trails -->
<g stroke="white" stroke-opacity="0.18" stroke-linecap="round" fill="none">
  <path d="M28 68 Q56 92 80 112" stroke-width="0.8"/>
  <path d="M175 72 Q148 96 122 114" stroke-width="0.8"/>
  <path d="M22 170 Q50 158 74 144" stroke-width="0.8"/>
  <path d="M178 172 Q150 160 126 148" stroke-width="0.8"/>
</g>
<!-- Accretion disk -->
<ellipse cx="100" cy="130" rx="74" ry="22" fill="url(#disk)" filter="url(#g)"/>
<ellipse cx="100" cy="130" rx="74" ry="22" fill="url(#inner)" filter="url(#g)"/>
<ellipse cx="100" cy="130" rx="74" ry="22" fill="none" stroke="#ff6600" stroke-width="0.9" stroke-opacity="0.4"/>
<ellipse cx="100" cy="130" rx="60" ry="18" fill="none" stroke="#ffaa44" stroke-width="0.6" stroke-opacity="0.3"/>
<!-- Photon sphere glow -->
<circle cx="100" cy="130" r="30" fill="none" stroke="#ff8800" stroke-width="1.5" stroke-opacity="0.32" filter="url(#g)"/>
<!-- Event horizon — absolute black -->
<circle cx="100" cy="130" r="25" fill="#000000"/>
<circle cx="100" cy="130" r="25" fill="none" stroke="#1a0800" stroke-width="1.5"/>
<!-- Hawking ring -->
<circle cx="100" cy="130" r="27" fill="none" stroke="#552200" stroke-width="1" stroke-opacity="0.55" filter="url(#g)"/>
<rect width="200" height="280" fill="url(#v)" rx="10"/>
<rect x="5" y="5" width="190" height="270" rx="8" fill="none" stroke="url(#fr)" stroke-width="2" filter="url(#g)"/>
<rect x="5" y="5" width="190" height="270" rx="8" fill="none" stroke="#7733cc" stroke-width="0.6" stroke-opacity="0.7"/>
<g fill="#442288" opacity="0.9"><polygon points="9,9 20,9 9,20"/><polygon points="191,9 180,9 191,20"/><polygon points="9,271 20,271 9,260"/><polygon points="191,271 180,271 191,260"/></g>
<rect x="52" y="257" width="96" height="16" rx="4" fill="rgba(0,0,0,0.65)"/>
<text x="100" y="268.5" font-size="8.5" font-family="'Courier New',monospace" font-weight="bold" text-anchor="middle" fill="#9966dd" letter-spacing="3">VOID</text>
</svg>
