<svg xmlns="http://www.w3.org/2000/svg" width="400" height="260" viewBox="0 0 400 260">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#010208"/><stop offset="100%" stop-color="#04081a"/>
  </linearGradient>
  <filter id="g"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <radialGradient id="v" cx="50%" cy="50%" r="65%">
    <stop offset="0%" stop-color="rgba(0,0,0,0)"/><stop offset="100%" stop-color="rgba(0,0,0,0.5)"/>
  </radialGradient>
</defs>
<rect width="400" height="260" fill="url(#bg)" rx="12"/>
<!-- Stars -->
<g fill="white" opacity="0.5">
  <circle cx="12" cy="10" r="0.6"/><circle cx="38" cy="5" r="0.5"/><circle cx="88" cy="8" r="0.7"/>
  <circle cx="200" cy="6" r="0.5"/><circle cx="310" cy="10" r="0.6"/><circle cx="370" cy="4" r="0.5"/>
  <circle cx="8" cy="55" r="0.5"/><circle cx="392" cy="48" r="0.6"/>
  <circle cx="6" cy="200" r="0.5"/><circle cx="394" cy="195" r="0.6"/>
  <circle cx="20" cy="245" r="0.5"/><circle cx="380" cy="250" r="0.4"/>
</g>
<!-- Pulsar (left) -->
<line x1="60" y1="90" x2="60" y2="30" stroke="white" stroke-width="0.8" stroke-opacity="0.6"/>
<line x1="60" y1="90" x2="60" y2="150" stroke="white" stroke-width="0.8" stroke-opacity="0.6"/>
<ellipse cx="60" cy="90" rx="28" ry="7" fill="#3355aa" fill-opacity="0.5"/>
<circle cx="60" cy="90" r="8" fill="white" fill-opacity="0.9" filter="url(#g)"/>
<!-- Nebula (center-left) -->
<ellipse cx="138" cy="100" rx="38" ry="28" fill="#2244aa" fill-opacity="0.55" filter="url(#g)"/>
<circle cx="128" cy="88" r="6" fill="#aaccff" filter="url(#g)"/>
<circle cx="128" cy="88" r="2.5" fill="white"/>
<!-- Black hole (center) -->
<ellipse cx="210" cy="110" rx="44" ry="12" fill="#cc5500" fill-opacity="0.7" filter="url(#g)"/>
<circle cx="210" cy="110" r="18" fill="#000000"/>
<circle cx="210" cy="110" r="20" fill="none" stroke="#553300" stroke-width="1.5" filter="url(#g)"/>
<!-- Aurora (center-right) -->
<path d="M268 30 Q275 55 270 80 Q278 105 272 130 L285 130 Q290 105 283 80 Q290 55 296 30Z" fill="#00cc66" fill-opacity="0.6" filter="url(#g)"/>
<path d="M288 30 Q295 55 290 80 Q298 105 292 130 L308 130 Q312 105 305 80 Q312 55 318 30Z" fill="#00aa88" fill-opacity="0.5" filter="url(#g)"/>
<!-- Red giant (right) -->
<circle cx="358" cy="95" r="45" fill="#cc2200" fill-opacity="0.7" filter="url(#g)"/>
<circle cx="358" cy="95" r="28" fill="#ff6622" fill-opacity="0.85" filter="url(#g)"/>
<circle cx="358" cy="95" r="12" fill="#ffcc88" fill-opacity="0.95"/>
<!-- Horizon line separating content from label -->
<line x1="20" y1="175" x2="380" y2="175" stroke="white" stroke-opacity="0.1" stroke-width="0.5"/>
<!-- Title -->
<rect width="400" height="260" fill="url(#v)" rx="12"/>
<rect x="4" y="4" width="392" height="252" rx="10" fill="none" stroke="#5566aa" stroke-width="1.2" stroke-opacity="0.6"/>
<rect x="120" y="186" width="160" height="44" rx="6" fill="rgba(0,0,0,0.55)"/>
<text x="200" y="204" font-size="13" font-family="'Courier New',monospace" font-weight="bold" text-anchor="middle" fill="#aabbee" letter-spacing="4">VOID</text>
<text x="200" y="220" font-size="8" font-family="'Courier New',monospace" text-anchor="middle" fill="#6677aa" letter-spacing="2">DEEP SPACE COLLECTION</text>
</svg>
