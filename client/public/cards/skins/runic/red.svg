<svg xmlns="http://www.w3.org/2000/svg" width="200" height="280" viewBox="0 0 200 280">
<defs>
  <linearGradient id="s" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#1e0806"/><stop offset="50%" stop-color="#2e1008"/><stop offset="100%" stop-color="#3e1808"/>
  </linearGradient>
  <radialGradient id="rc" cx="50%" cy="50%" r="38%">
    <stop offset="0%" stop-color="#ff5500" stop-opacity="0.35"/><stop offset="100%" stop-color="#2e1008" stop-opacity="0"/>
  </radialGradient>
  <!-- Ember glow at edges -->
  <radialGradient id="ec" cx="50%" cy="100%" r="55%">
    <stop offset="0%" stop-color="#cc3300" stop-opacity="0.4"/><stop offset="100%" stop-color="#1e0806" stop-opacity="0"/>
  </radialGradient>
  <filter id="rg"><feGaussianBlur stdDeviation="4.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <radialGradient id="v" cx="50%" cy="50%" r="70%">
    <stop offset="0%" stop-color="rgba(0,0,0,0)"/><stop offset="100%" stop-color="rgba(0,0,0,0.5)"/>
  </radialGradient>
  <linearGradient id="fr" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#ff6633"/><stop offset="100%" stop-color="#661100"/>
  </linearGradient>
</defs>
<rect width="200" height="280" fill="url(#s)" rx="10"/>
<!-- Volcanic grain / lava veins -->
<g stroke="#4a1a0c" stroke-width="0.4" stroke-opacity="0.4">
  <line x1="0" y1="30" x2="200" y2="28"/><line x1="0" y1="60" x2="200" y2="62"/>
  <line x1="0" y1="92" x2="200" y2="90"/><line x1="0" y1="122" x2="200" y2="124"/>
  <line x1="0" y1="154" x2="200" y2="152"/><line x1="0" y1="184" x2="200" y2="186"/>
  <line x1="0" y1="214" x2="200" y2="212"/><line x1="0" y1="244" x2="200" y2="246"/>
</g>
<!-- Cracks -->
<g stroke="#cc3300" stroke-width="0.4" stroke-opacity="0.25">
  <path d="M40 70 Q55 80 50 100 Q65 88 70 110" fill="none"/>
  <path d="M148 160 Q138 172 145 190 Q132 182 128 200" fill="none"/>
</g>
<!-- Ember bottom glow -->
<ellipse cx="100" cy="280" rx="80" ry="55" fill="url(#ec)"/>
<!-- Rune glow -->
<ellipse cx="100" cy="136" rx="46" ry="56" fill="url(#rc)"/>
<!-- Tiwaz rune (warrior arrow pointing up) -->
<g fill="none" stroke="#ff6622" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" filter="url(#rg)" opacity="0.88">
  <line x1="100" y1="82" x2="100" y2="192"/>
  <line x1="100" y1="130" x2="74" y2="168"/>
  <line x1="100" y1="130" x2="126" y2="168"/>
</g>
<g fill="none" stroke="#ffa888" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
  <line x1="100" y1="82" x2="100" y2="192"/>
  <line x1="100" y1="130" x2="74" y2="168"/>
  <line x1="100" y1="130" x2="126" y2="168"/>
</g>
<rect x="5" y="5" width="190" height="270" rx="8" fill="none" stroke="url(#fr)" stroke-width="2.5"/>
<rect x="9" y="9" width="182" height="262" rx="6" fill="none" stroke="#dd4422" stroke-width="0.7" stroke-opacity="0.45"/>
<g fill="#aa2200" opacity="0.75">
  <polygon points="9,9 22,9 9,22"/><polygon points="191,9 178,9 191,22"/>
  <polygon points="9,271 22,271 9,258"/><polygon points="191,271 178,271 191,258"/>
</g>
<rect width="200" height="280" fill="url(#v)" rx="10"/>
<rect x="52" y="257" width="96" height="16" rx="4" fill="rgba(0,0,0,0.45)"/>
<text x="100" y="268.5" font-size="8.5" font-family="Georgia,serif" font-weight="bold" text-anchor="middle" fill="#ffaa88" letter-spacing="2.5">TIWAZ</text>
</svg>
