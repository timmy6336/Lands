<svg xmlns="http://www.w3.org/2000/svg" width="200" height="280" viewBox="0 0 200 280">
<defs>
  <linearGradient id="s" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#101810"/><stop offset="50%" stop-color="#182018"/><stop offset="100%" stop-color="#1e2a1a"/>
  </linearGradient>
  <radialGradient id="rc" cx="50%" cy="50%" r="38%">
    <stop offset="0%" stop-color="#44cc44" stop-opacity="0.32"/><stop offset="100%" stop-color="#182018" stop-opacity="0"/>
  </radialGradient>
  <filter id="rg"><feGaussianBlur stdDeviation="4.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <radialGradient id="v" cx="50%" cy="50%" r="70%">
    <stop offset="0%" stop-color="rgba(0,0,0,0)"/><stop offset="100%" stop-color="rgba(0,0,0,0.52)"/>
  </radialGradient>
  <linearGradient id="fr" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#44cc66"/><stop offset="100%" stop-color="#114422"/>
  </linearGradient>
</defs>
<rect width="200" height="280" fill="url(#s)" rx="10"/>
<!-- Mossy stone grain -->
<g stroke="#243824" stroke-width="0.35" stroke-opacity="0.38">
  <line x1="0" y1="24" x2="200" y2="22"/><line x1="0" y1="50" x2="200" y2="52"/>
  <line x1="0" y1="78" x2="200" y2="76"/><line x1="0" y1="106" x2="200" y2="108"/>
  <line x1="0" y1="134" x2="200" y2="132"/><line x1="0" y1="162" x2="200" y2="164"/>
  <line x1="0" y1="190" x2="200" y2="188"/><line x1="0" y1="218" x2="200" y2="220"/>
  <line x1="0" y1="246" x2="200" y2="244"/>
</g>
<!-- Lichen patches -->
<g fill="#2a4820" opacity="0.35">
  <ellipse cx="28" cy="72" rx="14" ry="8"/><ellipse cx="170" cy="110" rx="11" ry="6"/>
  <ellipse cx="35" cy="195" rx="12" ry="7"/><ellipse cx="165" cy="230" rx="10" ry="6"/>
</g>
<!-- Rune glow -->
<ellipse cx="100" cy="136" rx="46" ry="56" fill="url(#rc)"/>
<!-- Jera rune (harvest / cycle — interlocked chevrons) -->
<g fill="none" stroke="#44cc44" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" filter="url(#rg)" opacity="0.88">
  <!-- Top chevron -->
  <polyline points="72,132 100,90 128,132"/>
  <!-- Bottom chevron -->
  <polyline points="72,140 100,182 128,140"/>
</g>
<g fill="none" stroke="#aaffaa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
  <polyline points="72,132 100,90 128,132"/>
  <polyline points="72,140 100,182 128,140"/>
</g>
<rect x="5" y="5" width="190" height="270" rx="8" fill="none" stroke="url(#fr)" stroke-width="2.5"/>
<rect x="9" y="9" width="182" height="262" rx="6" fill="none" stroke="#44aa44" stroke-width="0.7" stroke-opacity="0.45"/>
<g fill="#226622" opacity="0.75">
  <polygon points="9,9 22,9 9,22"/><polygon points="191,9 178,9 191,22"/>
  <polygon points="9,271 22,271 9,258"/><polygon points="191,271 178,271 191,258"/>
</g>
<rect width="200" height="280" fill="url(#v)" rx="10"/>
<rect x="52" y="257" width="96" height="16" rx="4" fill="rgba(0,0,0,0.45)"/>
<text x="100" y="268.5" font-size="8.5" font-family="Georgia,serif" font-weight="bold" text-anchor="middle" fill="#88ee88" letter-spacing="3">JERA</text>
</svg>
