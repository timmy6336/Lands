<svg xmlns="http://www.w3.org/2000/svg" width="200" height="280" viewBox="0 0 200 280">
<defs>
  <linearGradient id="s" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#040406"/><stop offset="50%" stop-color="#070710"/><stop offset="100%" stop-color="#0a0a16"/>
  </linearGradient>
  <!-- Obsidian glass sheen -->
  <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#1a1a28" stop-opacity="0.5"/><stop offset="50%" stop-color="#080810" stop-opacity="0"/><stop offset="100%" stop-color="#1a1a28" stop-opacity="0.3"/>
  </linearGradient>
  <radialGradient id="rc" cx="50%" cy="50%" r="38%">
    <stop offset="0%" stop-color="#aa55ff" stop-opacity="0.35"/><stop offset="100%" stop-color="#070710" stop-opacity="0"/>
  </radialGradient>
  <filter id="rg"><feGaussianBlur stdDeviation="4.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <radialGradient id="v" cx="50%" cy="50%" r="70%">
    <stop offset="0%" stop-color="rgba(0,0,0,0)"/><stop offset="100%" stop-color="rgba(0,0,0,0.6)"/>
  </radialGradient>
  <linearGradient id="fr" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#aa66ff"/><stop offset="100%" stop-color="#330055"/>
  </linearGradient>
</defs>
<rect width="200" height="280" fill="url(#s)" rx="10"/>
<!-- Obsidian glass sheen overlay -->
<rect width="200" height="280" fill="url(#sheen)" rx="10"/>
<!-- Subtle gloss lines (conchoidal fracture) -->
<g stroke="#1e1e30" stroke-width="0.5" stroke-opacity="0.45">
  <line x1="0" y1="40" x2="80" y2="0"/><line x1="0" y1="120" x2="120" y2="0"/>
  <line x1="0" y1="200" x2="160" y2="0"/><line x1="40" y1="280" x2="200" y2="40"/>
  <line x1="120" y1="280" x2="200" y2="120"/>
</g>
<!-- Rune glow -->
<ellipse cx="100" cy="136" rx="46" ry="56" fill="url(#rc)"/>
<!-- Hagalaz rune (chaos / hail — runic H with central diagonal) -->
<g fill="none" stroke="#aa55ff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" filter="url(#rg)" opacity="0.88">
  <line x1="78" y1="82" x2="78" y2="192"/>
  <line x1="122" y1="82" x2="122" y2="192"/>
  <line x1="78" y1="137" x2="122" y2="137"/>
</g>
<g fill="none" stroke="#ddaaff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
  <line x1="78" y1="82" x2="78" y2="192"/>
  <line x1="122" y1="82" x2="122" y2="192"/>
  <line x1="78" y1="137" x2="122" y2="137"/>
</g>
<rect x="5" y="5" width="190" height="270" rx="8" fill="none" stroke="url(#fr)" stroke-width="2.5"/>
<rect x="9" y="9" width="182" height="262" rx="6" fill="none" stroke="#8844cc" stroke-width="0.7" stroke-opacity="0.45"/>
<g fill="#442266" opacity="0.75">
  <polygon points="9,9 22,9 9,22"/><polygon points="191,9 178,9 191,22"/>
  <polygon points="9,271 22,271 9,258"/><polygon points="191,271 178,271 191,258"/>
</g>
<rect width="200" height="280" fill="url(#v)" rx="10"/>
<rect x="44" y="257" width="112" height="16" rx="4" fill="rgba(0,0,0,0.5)"/>
<text x="100" y="268.5" font-size="8.5" font-family="Georgia,serif" font-weight="bold" text-anchor="middle" fill="#cc88ff" letter-spacing="2">HAGALAZ</text>
</svg>
