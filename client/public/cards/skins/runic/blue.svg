<svg xmlns="http://www.w3.org/2000/svg" width="200" height="280" viewBox="0 0 200 280">
<defs>
  <linearGradient id="s" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0e141e"/><stop offset="50%" stop-color="#161e2c"/><stop offset="100%" stop-color="#1c2838"/>
  </linearGradient>
  <radialGradient id="rc" cx="50%" cy="50%" r="38%">
    <stop offset="0%" stop-color="#44aaee" stop-opacity="0.32"/><stop offset="100%" stop-color="#161e2c" stop-opacity="0"/>
  </radialGradient>
  <filter id="rg"><feGaussianBlur stdDeviation="4.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <radialGradient id="v" cx="50%" cy="50%" r="70%">
    <stop offset="0%" stop-color="rgba(0,0,0,0)"/><stop offset="100%" stop-color="rgba(0,0,0,0.55)"/>
  </radialGradient>
  <linearGradient id="fr" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#66aadd"/><stop offset="100%" stop-color="#224466"/>
  </linearGradient>
</defs>
<rect width="200" height="280" fill="url(#s)" rx="10"/>
<!-- Cold granite grain -->
<g stroke="#2a3848" stroke-width="0.35" stroke-opacity="0.38">
  <line x1="0" y1="22" x2="200" y2="24"/><line x1="0" y1="48" x2="200" y2="46"/>
