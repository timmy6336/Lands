<!-- Laguz rune (water — vertical + right-diagonal leg) -->
<g fill="none" stroke="#44aaee" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" filter="url(#rg)" opacity="0.88">
  <line x1="100" y1="82" x2="100" y2="192"/>
  <line x1="100" y1="137" x2="130" y2="165"/>
</g>
<g fill="none" stroke="#aaddff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
